  exportFailedTestsCsv:
    needs: unitTests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: build/test-results/

      - name: List downloaded XML
        run: ls -l build/test-results/

      - name: Install Python dependencies
        run: pip install lxml
      - name: Convert JUnit XML to CSV (failed tests only)
        run: |
          python - <<'EOF'
          import csv, glob
          from lxml import etree

          xml_files = glob.glob('build/test-results/test/*.xml')
          output_file = 'failed-tests.csv'

          with open(output_file, 'w', newline='', encoding='utf-8') as csvfile:
              writer = csv.writer(csvfile)
              writer.writerow(['class', 'method', 'message', 'stacktrace'])

              for xml_file in xml_files:
                  tree = etree.parse(xml_file)
                  for testcase in tree.xpath('//testcase[failure]'):
                      class_name = testcase.get('classname', '')
                      method_name = testcase.get('name', '')
                      failure = testcase.find('failure')
                      if failure is not None:
                          message = failure.get('message', '').replace('\n','\\n')
                          stacktrace = failure.text.strip().replace('\n','\\n') if failure.text else ''
                          writer.writerow([class_name, method_name, message, stacktrace])

          print(f"CSV generated: {output_file}")
          EOF
      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-csv
          path: failed-tests.csv

  sendBuildInfo:
    if: always()
    needs: unitTests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Send build info to Drill4J
        run: ./gradlew drillSendBuildInfo
  reportByPR:
    if: (github.event_name == 'pull_request') && always()
    needs: sendBuildInfo
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Send coverage report to Drill4J
        run: ./gradlew drillGithubPullRequestReport
  reportByBranch:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
    needs: sendBuildInfo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Generate Drill4J Change Testing Report
        run: ./gradlew drillGenerateChangeTestingReport
      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: change-testing-report
          path: ./build/drill-reports/*.md